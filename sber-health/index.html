<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f7" />
    <title>ИИ-помощник — СберЗдоровье</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../assets/icons/favicon.png" />
    <meta
      name="description"
      content="Интерактивный концепт ИИ-помощника СберЗдоровья: встряхните телефон, чтобы открыть сводку здоровья."
    />
    <link rel="preload" as="image" href="../assets/images/sber-health/avatar-figma.jpg" />
    <link rel="preload" as="image" href="../assets/images/sber-health/card-relatives.jpg" />
    <link rel="preload" as="image" href="../assets/images/sber-health/summary.png" />
    <link rel="stylesheet" href="../css/sber-health.css?v=20260805-shake-only-1" />
  </head>
  <body>
    <main class="sber-demo" aria-label="Концепт ИИ-помощника СберЗдоровья">
      <section
        class="sber-phone"
        data-phone-screen
        aria-label="Экран ИИ-помощника"
        aria-live="polite"
      >
        <div class="sber-home" data-home-screen>
          <div class="sber-stage" data-design-stage>
            <header class="assistant-nav" aria-label="ИИ-помощник">
              <span class="nav-button" aria-hidden="true">
                <img src="../assets/images/sber-health/icon-close.svg" alt="" />
              </span>
              <span class="assistant-brand">
                <img src="../assets/images/sber-health/icon-ai.svg" alt="" />
                <span>ИИ-помощник</span>
              </span>
              <span class="nav-button" aria-hidden="true">
                <img src="../assets/images/sber-health/icon-refresh.svg" alt="" />
              </span>
            </header>

            <h1 class="assistant-title">Привет, Анна!<br />Чем могу помочь?</h1>

            <div class="card-slot card-slot--lab">
              <article class="health-card health-card--glass">
                <h2>Помоги<br />расшифровать<br />анализы</h2>
                <div class="analysis-icons" aria-hidden="true">
                  <span class="analysis-icon"><img src="../assets/images/sber-health/icon-brain.svg" alt="" /></span>
                  <span class="analysis-icon"><img src="../assets/images/sber-health/icon-knee.svg" alt="" /></span>
                  <span class="analysis-icon"><img src="../assets/images/sber-health/icon-spleen.svg" alt="" /></span>
                  <b>+4</b>
                </div>
              </article>
            </div>

            <div class="patient-avatar" aria-hidden="true">
              <img src="../assets/images/sber-health/avatar-figma.jpg" alt="" />
            </div>

            <div class="card-slot card-slot--relatives">
              <article class="health-card health-card--relatives">
                <img
                  class="relatives-image"
                  src="../assets/images/sber-health/card-relatives.jpg"
                  alt=""
                />
                <h2>Узнать состояние<br />родственников</h2>
              </article>
            </div>

            <div class="card-slot card-slot--doctor">
              <article class="health-card health-card--glass">
                <h2>Записаться<br />к врачу</h2>
                <img
                  class="medical-bag"
                  src="../assets/images/sber-health/icon-medical-bag.svg"
                  alt=""
                  aria-hidden="true"
                />
              </article>
            </div>

            <div class="shake-hint">
              <span class="shake-symbol" aria-hidden="true">
                <img class="shake-symbol__phone" src="../assets/images/sber-health/shake-phone.svg" alt="" />
                <img class="shake-symbol__top" src="../assets/images/sber-health/shake-top.svg" alt="" />
                <img class="shake-symbol__bottom" src="../assets/images/sber-health/shake-bottom.svg" alt="" />
              </span>
              <p>Встряхните, чтобы получить<br />сводку здоровья</p>
            </div>

            <div class="assistant-composer" aria-label="Поле сообщения">
              <div class="composer-row">
                <span class="composer-plus" aria-hidden="true">
                  <img src="../assets/images/sber-health/button-plus.svg" alt="" />
                </span>
                <div class="composer-input">
                  <span>Введите сообщение</span>
                  <img src="../assets/images/sber-health/icon-voice.svg" alt="" aria-hidden="true" />
                </div>
              </div>
              <p>AI-помощник не заменяет консультацию врача</p>
            </div>
          </div>
        </div>

        <img
          class="sber-screen sber-screen--summary"
          src="../assets/images/sber-health/summary.png"
          alt="Сводка здоровья с результатами анализа крови"
          width="402"
          height="874"
          decoding="async"
        />

        <div class="summary-mask summary-mask--intro" aria-hidden="true"></div>
        <div class="summary-mask summary-mask--card" aria-hidden="true"></div>
        <div class="summary-mask summary-mask--explanation" aria-hidden="true"></div>

        <div class="ai-writing" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>

        <button
          class="motion-activation"
          type="button"
          data-motion-activation
          aria-label="На iPhone нажмите один раз, разрешите доступ к движению и встряхните телефон"
          hidden
        ></button>

        <div class="motion-permission" data-motion-permission hidden>
          <p class="motion-permission__text" data-motion-text>
            Разреши доступ к движению — тогда встряхивание сработает.
          </p>
          <button class="motion-permission__button" type="button" data-enable-motion>
            Включить встряхивание
          </button>
        </div>

        <p class="sber-status" data-status aria-live="polite"></p>
      </section>

      <button class="demo-toggle" type="button" data-demo-toggle aria-label="Показать экран сводки">
        Показать сводку
      </button>
    </main>

    <script src="../js/sber-health.js?v=20260805-shake-only-1"></script>
  </body>
</html>
